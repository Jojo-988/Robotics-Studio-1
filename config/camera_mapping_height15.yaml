# Separate experimental profile; unchanged low-altitude default remains in repo.
camera_bird_mapper:
  ros__parameters:
    use_sim_time: true
    image_topic: /parrot1/camera/image
    camera_info_topic: /parrot1/camera/camera_info
    camera_frame: parrot1_camera_link
    target_frame: parrot1_odom
    output_prefix: /parrot1/camera_bird_map
    # 80 x 80 m canvas includes a yaw-rotated 15m footprint near (2.35,1.11).
    # This is an image canvas, not a cleared flight area or survey target.
    resolution: 0.10
    origin_x: -40.0
    origin_y: -40.0
    width: 800
    height: 800
    ground_z: 0.0
    exclude_bottom: 0.10
    process_hz: 1.0
    pair_timeout_sec: 2.0
    save_directory: ~/team-results/drone-camera/height15-live
